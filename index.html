<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="세경고등학교 인공지능반도체과 흡광광도법 온라인 실험실 — 기초 이론 게임, 가상 기초 실습, 화학분석기능사 실기 모의시험">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>세경고 Virtual Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#EEF2F1; --surface:#FFFFFF; --surface2:#F6F8F7; --ink:#15201E; --muted:#56655F; --line:#D3DCD9;
  --accent:#D3121A; --accent-ink:#FFFFFF; --accent-soft:#FDE4E4; --gold:#FFB414; --sred:#FC1820; --glass:#2A7584; --glass-soft:#DDEFF2;
  --ok:#1D7F46; --ok-soft:#DDF2E5; --warn:#A96A00; --warn-soft:#FBEFD6; --bad:#B8322A; --bad-soft:#F9E0DE;
  --lcd:#0F2A26; --lcd-ink:#9CF2D6; --shadow:0 1px 2px rgba(20,32,30,.06),0 6px 20px rgba(20,32,30,.06);
  --liquid:#8E1C74; --water:#CFE8F0;
  --r:12px;
  --fd:"Do Hyeon","IBM Plex Sans KR",system-ui,sans-serif;
  --fb:"IBM Plex Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
  --fm:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0E1514; --surface:#16201E; --surface2:#1B2724; --ink:#E4EDEA; --muted:#94A6A1; --line:#2B3A37;
  --accent:#FF5F64; --accent-ink:#1E0506; --accent-soft:#3E1517; --glass:#6CC6D6; --glass-soft:#16353B;
  --ok:#5CCB8A; --ok-soft:#173424; --warn:#E9B04A; --warn-soft:#3A2C10; --bad:#F07C72; --bad-soft:#3D1A17;
  --lcd:#071614; --lcd-ink:#8FF0D0; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  --liquid:#C0349E; --water:#2B4A55;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1514; --surface:#16201E; --surface2:#1B2724; --ink:#E4EDEA; --muted:#94A6A1; --line:#2B3A37;
  --accent:#FF5F64; --accent-ink:#1E0506; --accent-soft:#3E1517; --glass:#6CC6D6; --glass-soft:#16353B;
  --ok:#5CCB8A; --ok-soft:#173424; --warn:#E9B04A; --warn-soft:#3A2C10; --bad:#F07C72; --bad-soft:#3D1A17;
  --lcd:#071614; --lcd-ink:#8FF0D0; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  --liquid:#C0349E; --water:#2B4A55;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:15px;line-height:1.6;padding-inline:16px;padding-block:0 48px}
h1,h2,h3{font-family:var(--fd);font-weight:400;line-height:1.2;text-wrap:balance;margin:0}
h1{font-size:clamp(34px,6vw,56px)} h2{font-size:clamp(26px,4vw,34px)} h3{font-size:21px}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--glass);outline-offset:2px}
input,select{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:8px 10px}
.wrap{max-width:1120px;margin:0 auto}
.mono{font-family:var(--fm);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:12px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.panel{background:var(--surface2);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 18px;font-weight:600;transition:transform .08s,background .15s,border-color .15s}
.btn:hover{border-color:var(--glass)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.glass{background:var(--glass);border-color:var(--glass);color:var(--surface)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--surface2);border:1px solid var(--line)}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.note{border-left:3px solid var(--glass);padding:8px 12px;background:var(--glass-soft);border-radius:0 8px 8px 0;font-size:14px}
.note.warn{border-color:var(--warn);background:var(--warn-soft)}
.note.bad{border-color:var(--bad);background:var(--bad-soft)}
.note.ok{border-color:var(--ok);background:var(--ok-soft)}
.hidden{display:none!important}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);margin-inline:-16px;padding:10px 16px}
.topbar .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--fd);font-size:20px;display:flex;align-items:center;gap:8px;background:none;border:0;padding:0}
.crumbs{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:14px;flex-wrap:wrap}
.crumbs button{background:none;border:0;padding:2px 4px;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
main{padding-top:24px}

/* home */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:28px;align-items:center;padding-block:24px 8px}
.school{font-family:var(--fd);font-size:clamp(28px,4.6vw,42px);line-height:1.15;color:var(--ink);display:flex;flex-wrap:wrap;gap:0 12px;align-items:baseline}
.school span{color:var(--accent)}
.gate{display:flex;flex-direction:column;gap:10px;text-align:left;border-radius:18px;padding:24px;border:2px solid var(--line);background:var(--surface);box-shadow:var(--shadow);transition:transform .15s,border-color .15s;min-height:190px}
.gate:hover{transform:translateY(-3px)}
.gate.stu:hover{border-color:var(--accent)}.gate.tch:hover{border-color:var(--glass)}
.gate .gtag{font-family:var(--fm);font-size:12px;letter-spacing:.14em;color:var(--muted)}
.gate .gname{font-family:var(--fd);font-size:34px;line-height:1}
.gate.stu .gname{color:var(--accent)}.gate.tch .gname{color:var(--glass)}
.gate .gdesc{color:var(--muted);font-size:14.5px}
.gate .gcta{margin-top:auto;font-weight:700}
.hero .lead{font-size:17px;color:var(--muted);max-width:52ch;margin-top:12px}
.door{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.units{margin-top:28px}
.unit{display:flex;gap:14px;align-items:flex-start;padding:16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);text-align:left;width:100%}
.unit .num{font-family:var(--fm);font-size:13px;color:var(--muted);min-width:34px;padding-top:3px}
.unit.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.unit.off{opacity:.62;cursor:default}
@media (max-width:760px){.hero{grid-template-columns:1fr}}

/* hub */
.mode{display:flex;flex-direction:column;gap:12px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:22px;box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.mode:hover{transform:translateY(-3px);border-color:var(--accent)}
.mode .tag{font-family:var(--fm);font-size:12px;color:var(--accent)}
.mode ul{margin:0;padding-left:18px;color:var(--muted);font-size:14px}
.mode svg{width:100%;height:120px}

/* quiz */
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.lv{border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:18px;text-align:left;display:flex;flex-direction:column;gap:8px}
.lv:hover{border-color:var(--c)}
.lv .badge{width:54px;height:54px;border-radius:14px;display:grid;place-items:center;font-family:var(--fd);font-size:22px;color:#fff;background:var(--c)}
.hud{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.hearts{display:flex;gap:4px}
.heart{width:22px;height:20px}
.prog{height:8px;background:var(--line);border-radius:99px;overflow:hidden;flex:1;min-width:120px}
.prog i{display:block;height:100%;background:var(--accent);transition:width .3s}
.qcard{margin-top:14px}
.qtype{display:inline-block;font-family:var(--fd);font-size:17px;padding:3px 12px;border-radius:8px;background:var(--accent-soft);color:var(--accent)}
.qtext{font-size:19px;font-weight:600;margin-top:10px}
.cho{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
.cho span{font-family:var(--fd);font-size:40px;width:64px;height:72px;display:grid;place-items:center;background:var(--lcd);color:var(--lcd-ink);border-radius:10px}
.cho span.sp{background:transparent;width:18px}
.jam{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
.syl{width:66px;height:78px;border-radius:10px;border:2px dashed var(--glass);display:grid;grid-template-rows:1fr 1fr;grid-template-columns:1fr 1fr;padding:6px;font-family:var(--fd);font-size:24px;color:var(--glass);background:var(--glass-soft)}
.syl .c{grid-column:1;grid-row:1;display:grid;place-items:center}
.syl .v{grid-column:2;grid-row:1;display:grid;place-items:center;color:var(--muted);font-size:18px}
.syl .j{grid-column:1/3;grid-row:2;display:grid;place-items:center}
.syl.sp{border:0;background:none;width:14px}
.opts{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));margin-top:16px}
.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px;text-align:left;font-weight:500}
.opt:hover{border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.ox{display:flex;gap:14px;margin-top:18px}
.ox button{flex:1;font-family:var(--fd);font-size:54px;border-radius:16px;border:2px solid var(--line);background:var(--surface);padding:10px}
.ox button:hover{border-color:var(--accent)}
.ansrow{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.ansrow input{flex:1;min-width:180px;font-size:18px}
.blankq{font-size:19px;line-height:2}
.blankq .b{display:inline-block;min-width:90px;border-bottom:3px solid var(--accent);text-align:center;color:var(--accent);font-weight:700;padding:0 6px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.match .col{display:flex;flex-direction:column;gap:8px}
.mi{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;text-align:left}
.mi.sel{border-color:var(--accent);background:var(--accent-soft)}
.mi.done{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.mi.shake{animation:shake .35s}
.orderlist{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.oi{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px}
.oi .n{font-family:var(--fm);color:var(--muted);width:22px}
.oi .t{flex:1}
.oi button{border:1px solid var(--line);background:var(--surface2);border-radius:6px;width:34px;height:30px}
.feedback{margin-top:16px;border-radius:12px;padding:14px 16px}
.feedback.ok{background:var(--ok-soft);color:var(--ink);border:1px solid var(--ok)}
.feedback.bad{background:var(--bad-soft);color:var(--ink);border:1px solid var(--bad)}
.feedback b{font-family:var(--fd);font-size:20px;font-weight:400}
.combo{font-family:var(--fd);color:var(--accent);font-size:20px}
.timer{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:10px}
.timer i{display:block;height:100%;background:var(--warn)}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes pop{0%{transform:scale(.9);opacity:.3}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .25s ease-out}
.pt{outline:none}.pt .tip{opacity:0;transition:opacity .12s;pointer-events:none}.pt:hover .tip,.pt:focus .tip{opacity:1}.pt:hover circle:nth-child(2),.pt:focus circle:nth-child(2){stroke:var(--ink);stroke-width:2}
.rank{font-family:var(--fd);font-size:88px;line-height:1;color:var(--accent)}

/* practice */
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:18px}
.tab{border:0;background:none;padding:8px 14px;border-radius:8px;font-weight:600;color:var(--muted)}
.tab.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.tab .ck{color:var(--ok)}
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.tool{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:600;font-size:14px}
.tool svg{width:70px;height:80px}
.tool.sel{border-color:var(--accent);background:var(--accent-soft)}
.bench{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.bench.wide{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}.bench.wider{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
@media (max-width:820px){.bench,.bench.wide,.bench.wider{grid-template-columns:1fr}.zoom{transform:scale(.8);transform-origin:top left}}
.stage{background:linear-gradient(var(--surface2),var(--surface2)) padding-box;border:1px solid var(--line);border-radius:14px;display:flex;justify-content:center;align-items:flex-end;gap:20px;padding:14px;min-height:280px;position:relative;flex-wrap:wrap}
.stage svg{max-width:100%}
.holdbtn{user-select:none;-webkit-user-select:none;touch-action:none}
.holdbtn.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.zoom{width:150px;height:150px;border-radius:50%;border:3px solid var(--ink);overflow:hidden;background:var(--surface)}
.steps{display:flex;flex-direction:column;gap:6px;counter-reset:s}
.stp{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:8px;font-size:14px}
.stp::before{counter-increment:s;content:counter(s);font-family:var(--fm);font-size:12px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--line);flex:none}
.stp.done{color:var(--muted)} .stp.done::before{background:var(--ok);color:#fff;content:"✓"}
.stp.cur{background:var(--accent-soft)} .stp.cur::before{background:var(--accent);color:#fff}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-weight:600}
.chip:hover{border-color:var(--accent)}
.chip.used{opacity:.35;pointer-events:none}
.slots{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.slot{min-width:110px;min-height:44px;border:2px dashed var(--line);border-radius:10px;display:grid;place-items:center;padding:6px 10px;font-weight:600;font-size:14px;text-align:center}
.slot.fill{border-style:solid;border-color:var(--glass);background:var(--glass-soft)}
.arrow{color:var(--muted);font-family:var(--fm)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--fm);font-size:11px}
.table{width:100%;border-collapse:collapse;font-size:14px}
.table th,.table td{border:1px solid var(--line);padding:6px 8px;text-align:center}
.table th{background:var(--surface2);font-weight:600}
.tw{overflow-x:auto}

/* instrument */
.inst{background:#D9DEDC;border-radius:18px;padding:14px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px;border:1px solid #BFC6C3;color:#15201E}
:root[data-theme="dark"] .inst{background:#2A3331;border-color:#3A4643;color:#E4EDEA}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .inst{background:#2A3331;border-color:#3A4643;color:#E4EDEA}}
@media (max-width:760px){.inst{grid-template-columns:1fr}}
.screen{background:var(--lcd);color:var(--lcd-ink);border-radius:10px;padding:12px;min-height:250px;font-family:var(--fm);font-size:13px;position:relative;overflow:hidden}
.screen .big{font-size:30px;font-weight:600}
.screen button{background:rgba(156,242,214,.1);border:1px solid rgba(156,242,214,.4);color:var(--lcd-ink);border-radius:6px;padding:6px 10px;font-family:var(--fm);font-size:12.5px}
.screen button:hover{background:rgba(156,242,214,.22)}
.screen input,.screen select{background:#0a1f1c;color:var(--lcd-ink);border-color:rgba(156,242,214,.35);font-family:var(--fm);padding:4px 8px;font-size:13px}
.screen .off{position:absolute;inset:0;background:#050b0a;display:grid;place-items:center;color:#3c5a54}
.screen table{width:100%;border-collapse:collapse}
.screen td,.screen th{border-bottom:1px solid rgba(156,242,214,.18);padding:3px 4px;text-align:right}
.screen th{text-align:right;font-weight:600;opacity:.7}
.holder{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pos{background:#11191A;border-radius:8px;padding:6px;color:#cfe;display:flex;flex-direction:column;align-items:center;gap:4px;font-family:var(--fm);font-size:11px;min-height:86px;border:2px solid transparent}
.pos.sel{border-color:var(--accent)}
.pos .cv{width:22px;height:40px;border:1.5px solid #9ab;border-radius:2px;position:relative;background:#1d2b2d}
.pos .cv i{position:absolute;left:0;right:0;bottom:0;height:78%}
.power{width:44px;height:44px;border-radius:50%;border:2px solid #6a7571;background:#2B3432;color:#fff;font-weight:700}
.power.on{background:var(--ok);border-color:var(--ok)}

/* exam */
.examgrid{display:grid;grid-template-columns:240px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:860px){.examgrid{grid-template-columns:1fr}}
.stepper{position:sticky;top:70px;display:flex;flex-direction:column;gap:4px}
@media (max-width:860px){.stepper{position:static;flex-direction:row;overflow-x:auto;padding-bottom:6px}}
.sb{border:0;background:none;text-align:left;padding:8px 10px;border-radius:8px;display:flex;gap:8px;align-items:center;font-size:14px;white-space:nowrap}
.sb .d{width:22px;height:22px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-family:var(--fm);font-size:11px;flex:none}
.sb.done .d{background:var(--ok);color:#fff}
.sb.cur{background:var(--surface);box-shadow:var(--shadow);font-weight:700}
.sb.cur .d{background:var(--accent);color:#fff}
.sb:disabled{opacity:.5;cursor:not-allowed}
.stamp{display:inline-grid;place-items:center;width:42px;height:42px;border:2px solid var(--bad);color:var(--bad);border-radius:50%;font-family:var(--fd);font-size:14px;transform:rotate(-12deg);animation:pop .3s}
.sheet{background:var(--surface);border:1.5px solid var(--ink);border-radius:4px;padding:18px}
.sheet h3{text-align:center;margin-bottom:10px}
.graphbox{background:#FFFDF7;border:1px solid #E4D9BF;border-radius:6px;overflow:hidden;touch-action:none}
:root[data-theme="dark"] .graphbox{background:#1C1A14;border-color:#3A3527}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .graphbox{background:#1C1A14;border-color:#3A3527}}
.score{font-family:var(--fd);font-size:72px;color:var(--accent);line-height:1}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;z-index:50;max-width:calc(100% - 32px);text-align:center;animation:pop .2s}
.modalbg{position:fixed;inset:0;background:rgba(10,16,15,.55);z-index:40;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:16px;max-width:560px;width:100%;padding:20px;max-height:90vh;overflow:auto}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* 첫 화면 */
#gate{position:fixed;inset:0;z-index:100;background:#FFFFFF;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));overflow:auto;color:#333;transition:opacity .6s ease}
#gate.gone{opacity:0;pointer-events:none}
.gplaque img{display:block;height:clamp(38px,6vw,52px);width:auto}
.gdept{font-family:var(--fd);font-size:clamp(20px,3.4vw,28px);color:#333;letter-spacing:.04em}
.gtitle{font-family:var(--fd);font-size:clamp(46px,9vw,84px);line-height:1;color:#FC1820;letter-spacing:.02em}
.gsub{font-size:clamp(14px,2.2vw,17px);color:#646363}
.gscene{width:min(560px,88vw);max-height:48vh;display:grid;place-items:center;cursor:pointer;transition:transform 1s cubic-bezier(.6,.05,.3,1)}
.gscene img{max-width:100%;max-height:48vh;height:auto;object-fit:contain;animation:float 5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
#gate.open .gscene{transform:scale(1.8)}
#gate.open .gtop,#gate.open .gbtn,#gate.open .gnote{opacity:0;transition:opacity .35s}
.gtop{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.gbtn{font-family:var(--fd);font-size:22px;padding:12px 34px;border-radius:999px;border:2px solid #FFB414;background:#FC1820;color:#fff;box-shadow:0 8px 22px rgba(252,24,32,.3);animation:pulse 2s infinite}
.gbtn:hover{background:#E0141B}
@keyframes pulse{50%{box-shadow:0 8px 34px rgba(252,24,32,.5)}}
.gnote{font-size:12.5px;color:#969696}
@media (prefers-reduced-motion:reduce){.gscene img{animation:none}.gscene{transition:none}}
</style>

function flaskSVG(o={}){

  <defs><clipPath id="${id}"><path d="${path}"/></clipPath></defs>

/* 스캔 그래프: 400→700 nm 자동 측정, 마우스로 값 읽기 */
function scanChart(el,o){
  const {f,from=400,to=700,step=2,dur=3200,lcd=false,W=640,H=300,onStep,onDone}=o;
  const L=48,R=16,T=18,B=34;const ymax=o.ymax||0.8;
  const x=l=>L+(l-from)/(to-from)*(W-L-R),y=a=>H-B-(Math.max(0,a)/ymax)*(H-T-B);
  const ink=lcd?'#9CF2D6':'var(--muted)',grid=lcd?'rgba(156,242,214,.15)':'var(--line)',line=lcd?'#FFB414':'var(--accent)';
  const pts=[];let raf=null,cur=null;
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" class="chart" tabindex="0" style="touch-action:none;cursor:crosshair;outline:none" aria-label="흡수 스펙트럼, 마우스를 올리면 값이 보여요">
   <defs><linearGradient id="vis${W}" x1="0" x2="1">${Array.from({length:16},(_,i)=>{const l=from+i*(to-from)/15;return `<stop offset="${i/15}" stop-color="${wlColor(l)}"/>`}).join('')}</linearGradient></defs>
   <rect x="${L}" y="${H-B+2}" width="${W-L-R}" height="5" fill="url(#vis${W})" opacity=".85"/>
   ${[0,.2,.4,.6,.8].filter(a=>a<=ymax+1e-9).map(a=>`<line x1="${L}" x2="${W-R}" y1="${y(a)}" y2="${y(a)}" stroke="${grid}"/><text x="${L-6}" y="${y(a)+4}" text-anchor="end" style="fill:${ink}">${a.toFixed(1)}</text>`).join('')}
   ${[400,450,500,550,600,650,700].map(l=>`<text x="${x(l)}" y="${H-8}" text-anchor="middle" style="fill:${ink}">${l}</text>`).join('')}
   <text x="${W-R}" y="${H-B-6}" text-anchor="end" style="fill:${ink}">파장 (nm)</text><text x="${L+4}" y="${T+8}" style="fill:${ink}">흡광도</text>
   <polyline id="sl" fill="none" stroke="${line}" stroke-width="2.2" points=""/>
   <line id="sc" y1="${T}" y2="${H-B}" stroke="${ink}" stroke-dasharray="3 3" opacity="0"/>
   <g id="sh" opacity="0" pointer-events="none"><line id="shl" y1="${T}" y2="${H-B}" stroke="${lcd?'#fff':'var(--ink)'}" stroke-width="1" opacity=".5"/><circle id="shc" r="5" fill="${line}" stroke="${lcd?'#000':'#fff'}" stroke-width="1.5"/>
    <rect id="shr" width="128" height="24" rx="5" fill="${lcd?'#E9FFF7':'var(--ink)'}"/><text id="sht" style="fill:${lcd?'#06201B':'var(--bg)'};font-size:12px" text-anchor="middle"></text></g>
   <rect x="${L}" y="${T}" width="${W-L-R}" height="${H-T-B}" fill="transparent" id="shit"/>
  </svg>`;
  const svg=el.querySelector('svg');
  function show(i){if(i==null||!pts[i])return;cur=i;const [l,a]=pts[i];const X=x(l),Y=y(a);const g=$('#sh',svg);g.setAttribute('opacity',1);
    $('#shl',svg).setAttribute('x1',X);$('#shl',svg).setAttribute('x2',X);$('#shc',svg).setAttribute('cx',X);$('#shc',svg).setAttribute('cy',Y);
    const rx=Math.min(W-R-130,Math.max(L+2,X-64)),ry=Y<T+40?Y+12:Y-34;$('#shr',svg).setAttribute('x',rx);$('#shr',svg).setAttribute('y',ry);
    const t=$('#sht',svg);t.setAttribute('x',rx+64);t.setAttribute('y',ry+16);t.textContent=`${l} nm · A ${a.toFixed(4)}`;o.onHover&&o.onHover(l,a)}
  svg.addEventListener('pointermove',e=>{if(!pts.length)return;const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const q=p.matrixTransform(svg.getScreenCTM().inverse());const l=from+(q.x-L)/(W-L-R)*(to-from);
    let bi=0,bd=1e9;pts.forEach((pt,i)=>{const d=Math.abs(pt[0]-l);if(d<bd){bd=d;bi=i}});show(bi)});
  svg.addEventListener('keydown',e=>{if(!pts.length)return;const d={ArrowLeft:-1,ArrowRight:1}[e.key];if(!d)return;e.preventDefault();e.stopPropagation();show(Math.max(0,Math.min(pts.length-1,(cur??0)+d*(e.shiftKey?5:1))))});
  return {
    start(){cancelAnimationFrame(raf);pts.length=0;$('#sh',svg).setAttribute('opacity',0);const n=Math.round((to-from)/step);const t0=performance.now();
      const tick=now=>{const k=Math.max(0,Math.min(n,Math.floor((now-t0)/dur*n)));while(pts.length<=k){const l=from+pts.length*step;pts.push([l,f(l)+gauss()*0.0015])}
        $('#sl',svg).setAttribute('points',pts.map(p=>x(p[0])+','+y(p[1])).join(' '));const lc=pts[pts.length-1][0];const c=$('#sc',svg);c.setAttribute('x1',x(lc));c.setAttribute('x2',x(lc));c.setAttribute('opacity',.8);onStep&&onStep(lc);
        if(k<n)raf=requestAnimationFrame(tick);else{c.setAttribute('opacity',0);onDone&&onDone(pts)}};
      raf=requestAnimationFrame(tick);onLeave(()=>cancelAnimationFrame(raf))},
    get points(){return pts}
  };
}

/* 분광 모델 */
const G=(l,c,w)=>Math.exp(-(((l-c)/w)**2));
const SPEC={
  km:{name:'KMnO₄ 용액 (보라)',color:'rgba(142,28,116,.8)',f:l=>0.62*G(l,540,32)+0.10*G(l,508,13)+0.07*G(l,568,11)+0.02},
  yel:{name:'노란 색소 용액',color:'rgba(236,190,20,.85)',f:l=>0.7*G(l,427,38)+0.05*G(l,360,30)+0.01},
  blu:{name:'파란 색소 용액',color:'rgba(30,90,200,.8)',f:l=>0.66*G(l,630,26)+0.18*G(l,410,25)*0+0.12*G(l,585,18)+0.01}
};
const lmaxOf=k=>{let b=380,m=-1;for(let l=380;l<=720;l++){const v=SPEC[k].f(l);if(v>m){m=v;b=l}}return b};
function wlColor(l){ // 파장 → 색
  let r=0,g=0,b=0;if(l<380)return '#6a4c93';
  if(l<440){r=-(l-440)/60;b=1}else if(l<490){g=(l-440)/50;b=1}else if(l<510){g=1;b=-(l-510)/20}else if(l<580){r=(l-510)/70;g=1}else if(l<645){r=1;g=-(l-645)/65}else if(l<=780){r=1}
  return `rgb(${Math.round(r*255)},${Math.round(g*255)},${Math.round(b*255)})`;
}

    if(!ok)toast(sol.ppm?'바탕 용액이 아닌 용액으로 영점을 잡았어요! 이후 값이 모두 낮게 나옵니다.':'셀이 더러운 채로 영점을 잡았어요.',3500);
    o.onEvent&&o.onEvent('zero',{ok,lam:S.lam});
  }
  function measure(){
    const pos=S.holder.map((sid,i)=>({sid,i})).filter(x=>x.sid&&x.i>0);
    if(!pos.length){toast('#2~#8 칸에 측정할 용액을 넣으세요');return}
    const res=pos.map(x=>{const sol=o.getSol(x.sid);const A=Math.round(absOf(sol)*1e4)/1e4+0;return {pos:x.i,sid:x.sid,name:sol.short||sol.name,A}});
    S.rows.push(...res);S.last=res[res.length-1].A;screen();o.onEvent&&o.onEvent('measure',res);
  }
  $('#pw',el).onclick=()=>{
    if(S.power){S.power=false;S.view='off';$('#pw',el).classList.remove('on');screen();return}
    S.power=true;$('#pw',el).classList.add('on');S.view='boot';S.bootN=0;screen();o.onEvent&&o.onEvent('power');
    const t=setInterval(()=>{S.bootN++;screen();if(S.bootN>=7){clearInterval(t);setTimeout(()=>{S.view='home';screen();o.onEvent&&o.onEvent('booted')},350)}},320);
  };
  screen();renderHolder();renderRack();
  return {S,refresh(){renderRack();renderHolder();screen()},absOf};
}

function lineOf(){const [[x1,y1],[x2,y2]]=E.graph.h;const m=(y2-y1)/(x2-x1||1e-9);return {m,k:y1-m*x1}}
function drawGraph(){

    <path d="M${L-30} ${Y(Au)} H${L-4} M${L-10} ${Y(Au)-5} L${L-3} ${Y(Au)} L${L-10} ${Y(Au)+5}" stroke="var(--bad)" stroke-width="2" fill="none"/>

    ${g.scale?ylab+xlab:`<text x="${W/2}" y="${H/2}" text-anchor="middle" style="font-size:14px">먼저 세로축 눈금 단위를 정하세요</text>`}
    <text x="${W-R}" y="${H-12}" text-anchor="end" style="font-size:12px">농도 (ppm)</text><text x="${L}" y="${T-6}" style="font-size:12px">흡광도</text>
    ${g.scale?`${pts.map(p=>`<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="3.5" fill="var(--ink)"/><text x="${X(p[0])+6}" y="${Y(p[1])-8}" style="fill:var(--ink);font-size:11px">(${p[0]}, ${p[1].toFixed(4)})</text>`).join('')}
    <defs><clipPath id="plotclip"><rect x="${L}" y="${T}" width="${W-L-R}" height="${H-T-B}"/></clipPath></defs><line clip-path="url(#plotclip)" id="rline" x1="${la[0]}" y1="${la[1]}" x2="${lb[0]}" y2="${lb[1]}" stroke="var(--accent)" stroke-width="2"/>

}

  const by={};rows.forEach(r=>{const k=`${r.grade}|${r.cls}|${r.no}|${r.name}`;(by[k]=by[k]||{r,list:[]}).list.push(r)});
  const tm=x=>new Date(x.time||x.clientTime);
  const sum=Object.entries(by).map(([k,{r,list}])=>({k,grade:r.grade,cls:r.cls,no:r.no,name:r.name,sc:computeScores(list),n:list.length,last:list.map(tm).sort((a,b)=>b-a)[0]}))
    .sort((a,b)=>a.grade-b.grade||a.cls-b.cls||a.no-b.no||String(a.name).localeCompare(b.name));
  const avg=sum.length?r1(sum.reduce((s,x)=>s+x.sc.total,0)/sum.length):0;
  const detail=rows.slice().sort((a,b)=>tm(b)-tm(a));
  const dt=d=>new Date(d).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
  app.innerHTML=`<div class="row" style="justify-content:space-between;align-items:flex-end"><div><p class="eyebrow">교사용 · ${SHEET_URL?'Google 스프레드시트 연결됨':'이 기기에 저장된 기록'}</p><h2 style="margin-top:6px">수행평가 결과</h2></div>
   <div class="row"><button class="btn sm" id="trf">새로고침</button><button class="btn sm" id="tpw">비밀번호 변경</button><button class="btn sm" id="tall" style="border-color:var(--bad);color:var(--bad)">전체 초기화</button></div></div>
   ${SHEET_URL?'':'<div class="note warn" style="margin-top:12px">스프레드시트가 연결되지 않아 이 컴퓨터(브라우저)에서 활동한 학생 기록만 보여요. 모든 학생 기록을 모으려면 README대로 Apps Script를 연결하세요.</div>'}
   <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-top:14px">
    <div class="panel"><div class="small muted">학생 수</div><div class="mono" style="font-size:26px;font-weight:600">${sum.length}</div></div>
    <div class="panel"><div class="small muted">평균 총점</div><div class="mono" style="font-size:26px;font-weight:600">${avg}<span class="small muted"> / 100</span></div></div>
    <div class="panel"><div class="small muted">기록 수</div><div class="mono" style="font-size:26px;font-weight:600">${rows.length}</div></div>
    <div class="panel"><div class="small muted">실기 응시 학생</div><div class="mono" style="font-size:26px;font-weight:600">${sum.filter(s=>s.sc.exN).length}</div></div>
   </div>
   <div class="panel row" style="margin-top:14px">
    <label class="row small" style="gap:6px">학년 <select id="fg"><option value="">전체</option>${grades.map(g=>`<option ${f.g===g?'selected':''}>${g}</option>`).join('')}</select></label>
    <label class="row small" style="gap:6px">반 <select id="fc"><option value="">전체</option>${classes.map(c=>`<option ${f.c===c?'selected':''}>${c}</option>`).join('')}</select></label>
    <label class="row small" style="gap:6px;flex:1;min-width:180px">이름 <input id="fq" value="${esc(f.q)}" placeholder="이름으로 찾기" style="flex:1"></label>
   </div>
   <div class="card" style="margin-top:14px"><h3>학생별 수행평가</h3><p class="small muted" style="margin-top:4px">${SCORE_RULES.map(r=>`${r[0]} ${r[1]}`).join(' · ')} = 100점. 화학분석기능사는 가장 높은 회차 기준.</p>
    <div class="tw" style="margin-top:10px"><table class="table"><tr><th>학년</th><th>반</th><th>번호</th><th>이름</th><th>기초 이론<br><span class="small muted">20</span></th><th>기초 실습<br><span class="small muted">20</span></th><th>화학분석기능사<br><span class="small muted">60</span></th><th>총점<br><span class="small muted">100</span></th><th>세부</th><th>마지막 활동</th><th>초기화</th></tr>
    ${sum.map((s,i)=>`<tr><td>${s.grade}</td><td>${s.cls}</td><td>${s.no}</td><td style="font-weight:600">${esc(s.name)}</td><td class="mono">${s.sc.theory}</td><td class="mono">${s.sc.prac}</td><td class="mono">${s.sc.exA}</td><td class="mono" style="font-weight:700;color:var(--accent)">${s.sc.total}</td>
      <td class="small" style="text-align:left">이론 초${s.sc.th.초보}·중${s.sc.th.중급}·고${s.sc.th.고급} · 미션 ${s.sc.miss}/7 · 실기 ${s.sc.exN}회</td><td class="mono small">${s.last?dt(s.last):''}</td><td><button class="btn sm" data-rs="${i}">초기화</button></td></tr>`).join('')||'<tr><td colspan="11" class="muted">조건에 맞는 기록이 없어요</td></tr>'}</table></div></div>
   <div class="card" style="margin-top:14px"><h3>전체 기록 (최신순)</h3>
    <div class="tw" style="margin-top:10px"><table class="table"><tr><th>시간</th><th>학번</th><th>이름</th><th>구분</th><th>항목</th><th>점수</th><th>수행 반영</th><th style="text-align:left">상세</th></tr>
    ${detail.slice(0,TD.show).map(r=>`<tr><td class="mono small">${dt(r.time||r.clientTime)}</td><td class="mono">${r.grade}-${r.cls}-${r.no}</td><td>${esc(r.name)}</td><td>${esc(r.kind)}</td><td>${esc(r.item)}</td><td class="mono">${r.score}</td><td class="mono small">${r.kind==='화학분석기능사'?`${r.pa} / 60`:r.kind==='기초 이론'?`${r.pa}점`:'미션 1'}</td><td class="small" style="text-align:left">${esc(r.detail)}</td></tr>`).join('')}</table></div>
    ${detail.length>TD.show?`<div class="row" style="justify-content:center;margin-top:10px"><button class="btn sm" id="tmore">더 보기 (${detail.length-TD.show}건 남음)</button></div>`:''}
    ${SHEET_URL?'<p class="small muted" style="margin-top:8px">원본 데이터는 Google 스프레드시트 「결과」 시트에 있습니다. 초기화한 기록은 「삭제된 기록」 시트로 옮겨져 필요하면 되살릴 수 있어요.</p>':''}</div>`;
  $('#fg').onchange=e=>{f.g=e.target.value;drawTeacher()};$('#fc').onchange=e=>{f.c=e.target.value;drawTeacher()};
  $('#fq').oninput=e=>{f.q=e.target.value.trim();clearTimeout(TD.qt);TD.qt=setTimeout(()=>{drawTeacher();const q=$('#fq');q.focus();q.setSelectionRange(q.value.length,q.value.length)},300)};
  $('#trf').onclick=()=>{toast('새로 불러오는 중…');reloadTeacher()};
  const mo=$('#tmore');if(mo)mo.onclick=()=>{TD.show+=100;drawTeacher()};
  $$('[data-rs]').forEach(b=>b.onclick=()=>{const s=sum[+b.dataset.rs];confirmReset(`${s.grade}학년 ${s.cls}반 ${s.no}번 ${s.name}`,`이 학생의 기록 ${s.n}건을 모두 지웁니다.`,{scope:'one',grade:String(s.grade),cls:String(s.cls),no:String(s.no),name:String(s.name)})});
  $('#tall').onclick=()=>confirmReset('전체 학생',`모든 학생의 기록 ${all.length}건을 지웁니다. 새 학기·새 반 수업 전에 사용하세요.`,{scope:'all'},true);
  $('#tpw').onclick=changeKey;
}
function confirmReset(who,msg,params,strong){
  modal(`<h3 style="color:var(--bad)">${esc(who)} 결과 초기화</h3><p style="margin-top:8px">${esc(msg)}</p>
   ${strong?'<label class="stack" style="gap:4px;margin-top:10px"><span class="small">확인을 위해 <b>초기화</b>라고 입력하세요</span><input id="cf" autocomplete="off"></label>':''}
   <p class="small muted" style="margin-top:8px">${SHEET_URL?'지운 기록은 스프레드시트 「삭제된 기록」 시트에 보관됩니다.':'이 기기에서 지운 기록은 되살릴 수 없어요.'}</p>
   <div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn" data-close>취소</button><button class="btn" id="cfok" style="background:var(--bad);border-color:var(--bad);color:#fff">초기화</button></div>`,(m,close)=>{
    $('#cfok',m).onclick=async()=>{if(strong&&$('#cf',m).value.trim()!=='초기화'){toast('"초기화"라고 입력하세요');return}
      try{const j=await API.call({action:'reset',key:TD.key,...params});if(!j.ok){toast(j.error||'초기화 실패');return}close();toast(`${who} 기록 ${j.removed??''}건을 초기화했어요`);reloadTeacher()}
      catch(e){toast('초기화하지 못했어요. 인터넷 연결을 확인하세요.')}};
  });
}
function changeKey(){
  modal(`<h3>교사 비밀번호 변경</h3><form id="kf" class="stack" style="margin-top:12px;gap:10px">
   <label class="stack" style="gap:4px"><span class="small">새 비밀번호 (4자 이상)</span><input id="k1" type="password" autocomplete="new-password"></label>
   <label class="stack" style="gap:4px"><span class="small">새 비밀번호 확인</span><input id="k2" type="password" autocomplete="new-password"></label>
   <p class="small muted">${SHEET_URL?'스프레드시트에 저장되어 모든 기기에 바로 적용돼요.':'이 기기(브라우저)에만 적용돼요.'}</p>
   <div class="row" style="justify-content:flex-end"><button type="button" class="btn" data-close>취소</button><button class="btn pri" type="submit">변경</button></div></form>`,(m,close)=>{
    $('#kf',m).addEventListener('submit',async e=>{e.preventDefault();const a=$('#k1',m).value,b=$('#k2',m).value;
      if(a.length<4){toast('4자 이상 입력하세요');return}if(a!==b){toast('두 비밀번호가 달라요');return}
      try{const j=await API.call({action:'setkey',key:TD.key,newkey:a});if(!j.ok){toast(j.error||'변경 실패');return}TD.key=a;close();toast('비밀번호를 바꿨어요')}
      catch(err){toast('변경하지 못했어요. 인터넷 연결을 확인하세요.')}});
  });
}
function openGate(){
  const g=$('#gate');if(!g||g.dataset.busy)return;g.dataset.busy=1;
  const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  g.classList.add('open');
  setTimeout(()=>g.classList.add('gone'),reduce?50:700);
  setTimeout(()=>{g.remove();document.body.style.overflow=''},reduce?400:1400);
}
(function(){const g=$('#gate');if(!g)return;document.body.style.overflow='hidden';$('#gopen').onclick=openGate;$('#gframe').onclick=openGate;setTimeout(()=>$('#gopen').focus(),50)})();
render();flushOutbox();

</script>
</body>
</html>
